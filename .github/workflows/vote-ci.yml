name: Vote Service CI

on:
  push:
    paths:
      - "vote/**"
      - "my-k8s/**"
      - "kind-config.yaml"
      - ".github/workflows/vote-ci.yml"

  pull_request:
    paths:
      - "vote/**"
      - "my-k8s/**"
      - "kind-config.yaml"
      - ".github/workflows/vote-ci.yml"

jobs:
  vote-ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER_LOWER}/example-voting-app-vote:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Lint vote service
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 vote --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate Kubernetes manifests
        run: |
          for file in my-k8s/*.yaml; do
            echo "Validating $file"
            kubectl apply --dry-run=client --validate=false -f "$file"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build vote image
        run: |
          docker build -t "$IMAGE_NAME" ./vote

      - name: Push vote image
        run: |
          docker push "$IMAGE_NAME"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: voting-app-ci

      - name: Load vote image into kind
        run: |
          kind load docker-image "$IMAGE_NAME" --name voting-app-ci

      - name: Deploy app except ingress
        run: |
          for file in my-k8s/*.yaml; do
            if [ "$(basename "$file")" != "ingress.yaml" ]; then
              kubectl apply -f "$file"
            fi
          done

      - name: Use newly built vote image
        run: |
          kubectl set image deployment/vote vote="$IMAGE_NAME"
          kubectl rollout status deployment/vote --timeout=180s

      - name: Wait for all pods
        run: |
          kubectl wait --for=condition=ready pod --all --timeout=180s

      - name: Smoke test vote endpoint
        run: |
          kubectl port-forward svc/vote 8080:80 &
          sleep 10
          curl -f http://localhost:8080
          